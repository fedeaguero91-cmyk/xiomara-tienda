<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiomi's Goodies</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Quicksand', sans-serif; color: #5A2540; background: #FDEEF4; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.serif { font-family: 'Baloo 2', cursive; }

.header { background: linear-gradient(135deg, #F2739D, #EEC06E); color: #FFF8FB; padding: 32px 24px 24px; position: sticky; top: 0; z-index: 10; overflow: hidden; box-shadow: 0 4px 14px rgba(214,72,127,0.18); }
.header-sparkles { position: absolute; inset: 0; pointer-events: none; }
.header-sparkles svg { position: absolute; filter: drop-shadow(0 0 3px rgba(255,255,255,0.6)); animation: twinkle 2.6s ease-in-out infinite; }
.spark-1 { top: 14px; left: 40%; width: 14px; height: 14px; animation-delay: 0s; }
.spark-2 { top: 54px; left: 46%; width: 9px; height: 9px; animation-delay: 0.9s; }
.spark-3 { top: 8px; left: 52%; width: 11px; height: 11px; animation-delay: 1.7s; }
@keyframes twinkle { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .header-sparkles svg { animation: none; opacity: 0.7; } }

.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
.brand { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 32px; letter-spacing: 0.3px; text-shadow: 0 2px 10px rgba(0,0,0,0.08); }
.tagline { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #FFE9F1; margin-top: 2px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.count { font-size: 12px; color: #FFF0F6; white-space: nowrap; font-weight: 500; }
.count b { color: #fff; font-weight: 700; }
.cart-btn { position: relative; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35); border-radius: 12px; padding: 9px 12px; color: #fff; display: flex; align-items: center; gap: 6px; }
.cart-btn:hover { background: rgba(255,255,255,0.32); }
.cart-btn svg { width: 18px; height: 18px; }
.cart-badge { position: absolute; top: -6px; right: -6px; background: #FFD966; color: #7A4A00; font-size: 11px; font-weight: 800; border-radius: 999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

.search-row { display: flex; gap: 8px; margin-top: 18px; max-width: 1100px; margin-left: auto; margin-right: auto; position: relative; z-index: 1; }
.search { flex: 1; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; font-weight: 500; }
.search::placeholder { color: #FFE4EF; }
.search:focus { background: rgba(255,255,255,0.3); border-color: #FFD966; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; max-width: 1100px; margin-left: auto; margin-right: auto; scrollbar-width: none; position: relative; z-index: 1; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.12); color: #fff; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.chip.active { background: #FFD966; border-color: #FFD966; color: #7A4A00; font-weight: 700; }

.banner { background: #FFF1D6; border-bottom: 1px solid #F4D998; color: #7A5100; font-size: 12.5px; padding: 10px 24px; display: none; align-items: center; gap: 8px; justify-content: center; font-weight: 600; }
.banner.show { display: flex; }

.body { padding: 20px 24px 110px; max-width: 1100px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.empty { text-align: center; padding: 60px 20px; color: #B87999; }
.empty .serif { font-size: 22px; margin-bottom: 6px; display: block; color: #D6487F; }
.loading { padding: 60px 20px; text-align: center; color: #B87999; font-size: 13px; }

.card { background: #FFFCFB; border: 1px solid #F5D9E7; border-radius: 18px; position: relative; overflow: hidden; box-shadow: 0 3px 10px rgba(214,72,127,0.06); }
.tag-hole { position: absolute; top: 12px; right: 12px; width: 16px; height: 16px; z-index: 2; }
.card-img { height: 150px; background: #FCEEF3; display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid #F5D9E7; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img svg { width: 44px; height: 44px; opacity: 0.3; color: #D6487F; }
.card.sold .card-img img, .card.sold .card-img svg { filter: grayscale(1); opacity: 0.45; }
.ribbon { position: absolute; top: 10px; right: -30px; background: #B93868; color: #fff; font-size: 10px; letter-spacing: 1.5px; font-weight: 700; padding: 3px 34px; transform: rotate(38deg); display: none; }
.card.sold .ribbon { display: block; }
.card-body { padding: 12px 14px 14px; }
.card-cat { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #D6487F; font-weight: 700; }
.card-name { font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15.5px; line-height: 1.25; margin: 3px 0 6px; min-height: 38px; color: #5A2540; }
.card-price { font-size: 16px; font-weight: 700; color: #C98A2E; font-family: 'Baloo 2', cursive; }
.cta { margin-top: 8px; width: 100%; border: none; border-radius: 12px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 5px; }
.cta svg { width: 13px; height: 13px; }
.cta-add { background: linear-gradient(135deg, #E85D93, #E8B65C); color: #fff; transition: filter 0.15s; }
.cta-add:hover { filter: brightness(1.06); }
.cta:disabled { background: #E7CBD7; color: #fff; cursor: not-allowed; }
.sold-label { margin-top: 10px; text-align: center; font-size: 12px; color: #C79BB0; font-style: italic; font-weight: 600; }
.stock-hint { font-size: 11px; color: #D6487F; font-weight: 700; margin-top: 2px; min-height: 14px; }
.qty-stepper { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #E85D93, #E8B65C); border-radius: 12px; padding: 4px; width: 100%; }
.qty-stepper button { background: rgba(255,255,255,0.25); border: none; color: #fff; width: 26px; height: 26px; border-radius: 8px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.qty-stepper button:hover { background: rgba(255,255,255,0.4); }
.qty-stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
.qty-stepper .qty-count { color: #fff; font-size: 13px; font-weight: 700; }
.qty-stepper.compact { padding: 2px; width: fit-content; }
.qty-stepper.compact button { width: 22px; height: 22px; font-size: 13px; }
.qty-stepper.compact .qty-count { font-size: 12px; min-width: 16px; text-align: center; }
.qty-stepper.neutral { background: linear-gradient(135deg, #B93868, #C98A2E); }

.wsp-float { position: fixed; left: 20px; bottom: 20px; z-index: 5; background: #25D366; color: #fff; border: none; border-radius: 999px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(37,211,102,0.4); }
.wsp-float svg { width: 26px; height: 26px; }

.overlay { position: fixed; inset: 0; background: rgba(90,37,64,0.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.overlay.show { display: flex; }
.panel { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 22px 22px 18px; }
.panel h3 { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 20px; margin: 0 0 14px; color: #5A2540; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11.5px; font-weight: 700; color: #A8687F; margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid #F0D0DE; border-radius: 10px; padding: 9px 10px; font-size: 13.5px; outline: none; }
.field input:focus, .field textarea:focus { border-color: #D6487F; }
.field-hint { font-size: 11px; color: #B993A8; margin-top: 3px; }
.carousel-track { height: 260px; background: #FCEEF3; position: relative; overflow: hidden; }
.carousel-track img, .carousel-track video { width: 100%; height: 100%; object-fit: contain; display: block; background: #FCEEF3; }
.carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); border: none; border-radius: 999px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; z-index: 2; color: #D6487F; }
.carousel-arrow svg { width: 16px; height: 16px; }
.carousel-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 2; }
.carousel-dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.6); }
.carousel-dot.active { background: #fff; }
.ship-options { display: flex; flex-direction: column; gap: 8px; }
.ship-option { display: flex; align-items: flex-start; gap: 10px; border: 1px solid #F0D0DE; border-radius: 14px; padding: 11px 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.ship-option:hover { border-color: #EFAFC7; }
.ship-option.selected { border-color: #D6487F; background: #FDF0F5; }
.ship-option input[type="radio"] { margin-top: 3px; flex-shrink: 0; accent-color: #D6487F; }
.ship-option .ship-icon { font-size: 19px; line-height: 1; flex-shrink: 0; width: 22px; text-align: center; }
.ship-option .ship-text { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.panel-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; border: none; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 700; }
.btn.primary { background: linear-gradient(135deg, #E85D93, #E8B65C); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { background: #E7CBD7; }
.btn.ghost { background: #FCEEF3; color: #5A2540; }
.panel-close { float: right; background: none; border: none; font-size: 18px; color: #C79BB0; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px); background: #5A2540; color: #FFF0F6; padding: 10px 18px; border-radius: 12px; font-size: 12.5px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 30; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.cart-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #FCEEF3; }
.cart-item-img { width: 46px; height: 46px; border-radius: 10px; background: #FCEEF3; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-name { font-size: 13px; font-weight: 600; }
.cart-item-price { font-size: 12.5px; color: #C98A2E; font-weight: 700; }
.cart-item-remove { margin-left: auto; background: none; border: none; color: #C79BB0; font-size: 16px; padding: 4px; }
.cart-total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0D0DE; font-family: 'Baloo 2', cursive; color: #5A2540; }

.summary-line { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.summary-box { background: #FDF0F5; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 12.5px; }

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .header { padding: 24px 16px 18px; }
  .body { padding: 16px 16px 110px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-sparkles">
    <svg class="spark-1" viewBox="0 0 24 24" fill="#FFE9C2"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg>
    <svg class="spark-2" viewBox="0 0 24 24" fill="#FFF6E0"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg>
    <svg class="spark-3" viewBox="0 0 24 24" fill="#FFE9C2"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg>
  </div>
  <div class="brand-row">
    <div>
      <div class="brand" id="brandName">Xiomi's Goodies</div>
      <div class="tagline" id="tagline">Accesorios y cositas lindas de importación</div>
    </div>
    <div class="header-right">
      <div class="count" id="countLbl"></div>
      <button class="cart-btn" onclick="openCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
      </button>
    </div>
  </div>
  <div class="search-row"><input class="search" id="searchInput" placeholder="Buscar producto..."></div>
  <div class="chips" id="chips"></div>
</div>

<div class="banner" id="banner">⚠️ Este catálogo todavía no tiene WhatsApp configurado.</div>

<div class="body">
  <div id="loading" class="loading">Cargando catálogo...</div>
  <div class="grid" id="grid" style="display:none;"></div>
  <div class="empty" id="empty" style="display:none;">
    <span class="serif">No hay productos por acá</span>
    Probá con otra búsqueda.
  </div>
</div>

<button class="wsp-float" id="wspFloat" style="display:none;" onclick="openWhatsapp()" title="Consultanos por WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.7 14.2c-.2.6-1.3 1.2-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-.9-.3-1.6-.6-2.7-1.2-4.5-3.9-4.6-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.9 1.5 1.9 2.4 1.3 1.2 2.4 1.5 2.7 1.7.3.2.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.2.7-.1.3.1 1.8.9 2.1 1 .3.2.5.2.6.3.1.2.1.7-.1 1.3Z"/></svg>
</button>

<div class="overlay" id="orderOverlay">
  <div class="panel" style="max-width:420px;">
    <button class="panel-close" onclick="closeOverlay('orderOverlay')">✕</button>
    <h3>Tu pedido</h3>
    <div id="orderItemsList"></div>

    <div id="orderEmptyMsg" style="display:none; color:#8A7268; text-align:center; padding:20px 0;">Todavía no agregaste nada.</div>

    <div id="orderFormSection">
      <div class="field" style="margin-top:14px;"><label>Nombre y apellido</label><input id="checkoutName"></div>
      <div class="field"><label>Teléfono</label><input id="checkoutPhone" placeholder="Ej: 3511234567"></div>

      <label style="display:block; font-size:11.5px; font-weight:600; color:#6B5850; margin-bottom:6px;">Método de envío</label>
      <div class="ship-options">
        <label class="ship-option" data-method="correo">
          <input type="radio" name="checkoutShipping" value="correo" onchange="onShippingChange()">
          <span class="ship-icon">📮</span>
          <span class="ship-text">Correo Argentino</span>
        </label>
        <label class="ship-option" data-method="uber">
          <input type="radio" name="checkoutShipping" value="uber" onchange="onShippingChange()">
          <span class="ship-icon">🚗</span>
          <span class="ship-text">Uber, dentro del anillo de circunvalación</span>
        </label>
        <label class="ship-option" data-method="retiro">
          <input type="radio" name="checkoutShipping" value="retiro" onchange="onShippingChange()">
          <span class="ship-icon">🏪</span>
          <span class="ship-text">Retiro</span>
        </label>
      </div>

      <div class="field" id="fieldAddress" style="display:none; margin-top:10px;">
        <label>Dirección completa y localidad</label>
        <textarea id="checkoutAddress" rows="2"></textarea>
      </div>
      <div class="field" id="fieldPostal" style="display:none;">
        <label>Código postal</label>
        <input id="checkoutPostal" onblur="fetchCorreoQuote()">
        <div class="field-hint" id="correoQuoteStatus"></div>
      </div>
      <div id="fieldPickup" style="display:none; margin-top:10px;">
        <label style="display:block; font-size:11.5px; font-weight:600; color:#6B5850; margin-bottom:6px;">Elegí dónde retirar</label>
        <div id="pickupOptions" class="ship-options"></div>
      </div>
      <div class="field-hint" id="genericShippingHint">El costo del envío se coordina aparte, no se cobra en este pago.</div>

      <div class="summary-box" style="margin-top:14px;" id="orderSummaryBox"></div>

      <button class="btn primary" style="width:100%;" id="orderSubmitBtn" onclick="submitCheckout()">Confirmar y pagar</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="panel" id="detailPanel" style="max-width:420px; padding:0; overflow:hidden;">
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://bulwqquqnrrggkcgpphi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHdxcXVxbnJyZ2drY2dwcGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTQzMTQsImV4cCI6MjEwMjIzMDMxNH0.6LW67VrcVX8zQ34qm_1UEArjm8MvLWtIX56LoP98KzM';

  let PRODUCTS = [];
  let SETTINGS = { store_name: 'Xiomisgoodies', tagline: '', whatsapp: '' };
  let searchTerm = '';
  let activeCat = 'Todos';
  let CART = [];

  const ICONS = {
    default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>',
    bolsos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>',
    lentes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="13" r="3.5"/><circle cx="17.5" cy="13" r="3.5"/><path d="M10 12h4M3 12l1-3h2M21 12l-1-3h-2"/></svg>',
    relojes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6M9 3l1 3M15 3l-1 3"/></svg>',
    bijou: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="14" r="6"/><path d="M9 8l3-5 3 5"/></svg>',
    billeteras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h3M3 10h18"/></svg>'
  };
  function iconFor(cat){
    const k = (cat||'').toLowerCase();
    if (k.includes('bols') || k.includes('mochi')) return ICONS.bolsos;
    if (k.includes('lente') || k.includes('sol')) return ICONS.lentes;
    if (k.includes('reloj')) return ICONS.relojes;
    if (k.includes('bijou') || k.includes('joy') || k.includes('anillo') || k.includes('collar')) return ICONS.bijou;
    if (k.includes('billet')) return ICONS.billeteras;
    return ICONS.default;
  }
  function escHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  window.imgFallback = function(img){
    img.onerror = null;
    const wrap = img.parentElement;
    if (wrap) wrap.innerHTML = iconFor(img.getAttribute('data-cat') || '') + '<div class="ribbon">Vendido</div>';
  };
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2400);
  }
  function money(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }

  async function sbFetch(path, opts={}){
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      ...opts,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    if (!res.ok) throw new Error('Error de red con Supabase');
    return res.json();
  }

  let PICKUP_POINTS = [];

  async function loadData(){
    try {
      const [products, settingsRows, pickupRows] = await Promise.all([
        sbFetch('products?select=*&order=created_at.desc'),
        sbFetch('store_settings?select=*&id=eq.1'),
        sbFetch('pickup_points?select=*&order=created_at')
      ]);
      PRODUCTS = products;
      if (settingsRows && settingsRows[0]) SETTINGS = settingsRows[0];
      PICKUP_POINTS = pickupRows || [];
    } catch (e) {
      console.error(e);
      showToast('No se pudo cargar el catálogo');
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    loadCart();
    render();
  }

  function loadCart(){
    try {
      const raw = localStorage.getItem('xiomara_cart');
      const parsed = raw ? JSON.parse(raw) : {};
      // Compatibilidad con el carrito viejo (lista simple de IDs).
      CART = Array.isArray(parsed) ? Object.fromEntries(parsed.map(id => [id, 1])) : (parsed || {});
    } catch { CART = {}; }
    Object.keys(CART).forEach(id => {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p || Number(p.stock) <= 0) delete CART[id];
      else if (CART[id] > p.stock) CART[id] = p.stock;
    });
    saveCart();
  }
  function saveCart(){
    try { localStorage.setItem('xiomara_cart', JSON.stringify(CART)); } catch {}
    renderCartBadge();
  }
  function cartQty(id){ return CART[id] || 0; }
  function isInCart(id){ return cartQty(id) > 0; }
  function stockOf(id){ const p = PRODUCTS.find(x => x.id === id); return p ? Number(p.stock) : 0; }

  window.addToCart = function(id){
    const stock = stockOf(id);
    if (stock <= 0) return;
    CART[id] = Math.min(stock, cartQty(id) + 1);
    saveCart();
    render();
    refreshOpenCart();
  };
  window.incrementCartQty = function(id){
    const stock = stockOf(id);
    if (cartQty(id) >= stock) { showToast('No hay más stock disponible'); return; }
    CART[id] = cartQty(id) + 1;
    saveCart();
    render();
    refreshOpenCart();
  };
  window.decrementCartQty = function(id){
    const next = cartQty(id) - 1;
    if (next <= 0) delete CART[id];
    else CART[id] = next;
    saveCart();
    render();
    refreshOpenCart();
  };
  function refreshOpenCart(){
    if (document.getElementById('orderOverlay').classList.contains('show')) renderOrderPanel();
    if (document.getElementById('detailOverlay').classList.contains('show') && detailOpenId) openDetail(detailOpenId);
  }
  function renderCartBadge(){
    const badge = document.getElementById('cartBadge');
    const total = Object.values(CART).reduce((s,q) => s + q, 0);
    if (total > 0) { badge.style.display = 'flex'; badge.textContent = total; }
    else badge.style.display = 'none';
  }
  function cartProducts(){ return Object.keys(CART).map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean); }

  function qtyStepperHtml(id, compact, neutral){
    const stock = stockOf(id);
    const qty = cartQty(id);
    const cls = 'qty-stepper' + (compact ? ' compact' : '') + (neutral ? ' neutral' : '');
    return '<div class="' + cls + '">' +
      '<button onclick="event.stopPropagation(); decrementCartQty(\'' + id + '\')">−</button>' +
      '<span class="qty-count">' + qty + '</span>' +
      '<button onclick="event.stopPropagation(); incrementCartQty(\'' + id + '\')" ' + (qty >= stock ? 'disabled' : '') + '>+</button>' +
    '</div>';
  }

  window.openCart = function(){
    renderOrderPanel();
    document.getElementById('orderOverlay').classList.add('show');
  };

  window.openWhatsapp = function(){
    const num = (SETTINGS.whatsapp || '').replace(/\D/g,'');
    if (!num) { showToast('Falta configurar el WhatsApp'); return; }
    const msg = 'Hola! Tengo una consulta sobre sus productos.';
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
  };

  function renderOrderPanel(){
    correoQuote = null;
    const items = cartProducts();
    const list = document.getElementById('orderItemsList');
    const formSection = document.getElementById('orderFormSection');
    const emptyMsg = document.getElementById('orderEmptyMsg');

    if (items.length === 0) {
      list.innerHTML = '';
      formSection.style.display = 'none';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    formSection.style.display = 'block';

    list.innerHTML = items.map(p => (
      '<div class="cart-item">' +
        '<div class="cart-item-img">' + ((p.images && p.images[0]) ? '<img src="' + escHtml(p.images[0]) + '">' : (p.image ? '<img src="' + escHtml(p.image) + '">' : iconFor(p.category))) + '</div>' +
        '<div><div class="cart-item-name">' + escHtml(p.name) + '</div><div class="cart-item-price">' + money(p.price) + ' c/u</div></div>' +
        '<div style="margin-left:auto;">' + qtyStepperHtml(p.id, true, true) + '</div>' +
      '</div>'
    )).join('');

    if (PICKUP_POINTS.length > 0) {
      document.getElementById('pickupOptions').innerHTML = PICKUP_POINTS.map((pt, i) => (
        '<label class="ship-option" data-pickup="' + pt.id + '">' +
          '<input type="radio" name="pickupPoint" value="' + pt.id + '" onchange="onShippingChange()" ' + (i===0?'':'') + '>' +
          '<span class="ship-icon">📍</span>' +
          '<span class="ship-text"><b>' + escHtml(pt.name) + '</b><br>' + escHtml(pt.address) + (pt.hours ? '<br>' + escHtml(pt.hours) : '') + '</span>' +
        '</label>'
      )).join('');
    } else {
      document.getElementById('pickupOptions').innerHTML = '<div class="field-hint">Coordinamos el punto y horario de retiro por WhatsApp después de la compra.</div>';
    }

    updateOrderSummary();
  }

  let correoQuote = null; // { price, deliveryTimeMin, deliveryTimeMax } o null si no aplica/no disponible

  window.onShippingChange = function(){
    const sel = document.querySelector('input[name=checkoutShipping]:checked');
    const method = sel ? sel.value : null;
    document.querySelectorAll('#orderFormSection > .ship-options .ship-option').forEach(opt => {
      opt.classList.toggle('selected', opt.dataset.method === method);
    });
    document.getElementById('fieldAddress').style.display = (method === 'correo' || method === 'uber') ? 'block' : 'none';
    document.getElementById('fieldPostal').style.display = method === 'correo' ? 'block' : 'none';
    document.getElementById('fieldPickup').style.display = method === 'retiro' ? 'block' : 'none';
    document.getElementById('genericShippingHint').style.display = (method === 'retiro' || (method === 'correo' && correoQuote)) ? 'none' : 'block';

    const pickupSel = document.querySelector('input[name=pickupPoint]:checked');
    document.querySelectorAll('#pickupOptions .ship-option').forEach(opt => {
      opt.classList.toggle('selected', pickupSel && opt.dataset.pickup === pickupSel.value);
    });

    if (method !== 'correo') { correoQuote = null; document.getElementById('correoQuoteStatus').textContent = ''; }
    updateOrderSummary();
  };

  window.fetchCorreoQuote = async function(){
    const method = document.querySelector('input[name=checkoutShipping]:checked')?.value;
    const postalCode = document.getElementById('checkoutPostal').value.trim();
    const statusEl = document.getElementById('correoQuoteStatus');
    if (method !== 'correo' || !postalCode) return;

    correoQuote = null;
    statusEl.textContent = 'Calculando el costo de envío...';
    try {
      const res = await fetch('/.netlify/functions/correo-quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cart: Object.entries(CART).map(([productId, quantity]) => ({ productId, quantity })),
          postalCode
        })
      });
      const data = await res.json();
      if (data.available) {
        correoQuote = data;
        statusEl.textContent = '✅ Envío: ' + money(data.price) + (data.deliveryTimeMax ? ' · llega en ' + data.deliveryTimeMin + '-' + data.deliveryTimeMax + ' días hábiles' : '');
      } else {
        correoQuote = null;
        statusEl.textContent = 'No pudimos calcular el envío automático todavía — se coordina el costo aparte.';
      }
    } catch {
      correoQuote = null;
      statusEl.textContent = 'No pudimos calcular el envío automático todavía — se coordina el costo aparte.';
    }
    document.getElementById('genericShippingHint').style.display = correoQuote ? 'none' : 'block';
    updateOrderSummary();
  };

  function selectedShippingLabel(){
    const sel = document.querySelector('input[name=checkoutShipping]:checked');
    if (!sel) return null;
    if (sel.value === 'correo' && correoQuote) return '📮 Correo Argentino';
    return { correo: '📮 Correo Argentino', uber: '🚗 Uber (circunvalación)', retiro: '🏪 Retiro' }[sel.value];
  }

  function updateOrderSummary(){
    const items = cartProducts();
    const productsTotal = items.reduce((s,p) => s + Number(p.price) * cartQty(p.id), 0);
    const method = document.querySelector('input[name=checkoutShipping]:checked')?.value;
    const shipLabel = selectedShippingLabel();
    const shippingCost = (method === 'correo' && correoQuote) ? Number(correoQuote.price) : 0;
    const total = productsTotal + shippingCost;
    document.getElementById('orderSummaryBox').innerHTML =
      items.map(p => '<div class="summary-line"><span>' + escHtml(p.name) + (cartQty(p.id) > 1 ? ' ×' + cartQty(p.id) : '') + '</span><span>' + money(p.price * cartQty(p.id)) + '</span></div>').join('') +
      '<div class="summary-line" style="margin-top:6px; padding-top:6px; border-top:1px solid #DCD0C6;"><span>Envío</span><span>' + (shippingCost > 0 ? money(shippingCost) : (shipLabel || '—')) + '</span></div>' +
      '<div class="cart-total-row" style="margin-top:8px; padding-top:8px;"><span>Total</span><span>' + money(total) + '</span></div>';
  }

  window.submitCheckout = async function(){
    const name = document.getElementById('checkoutName').value.trim();
    const phone = document.getElementById('checkoutPhone').value.trim();
    if (!name || !phone) { showToast('Completá tu nombre y teléfono'); return; }

    const sel = document.querySelector('input[name=checkoutShipping]:checked');
    if (!sel) { showToast('Elegí un método de envío'); return; }
    const method = sel.value;

    let address = document.getElementById('checkoutAddress').value.trim();
    const postalCode = document.getElementById('checkoutPostal').value.trim();

    if (method === 'correo' && (!address || !postalCode)) { showToast('Completá dirección y código postal'); return; }
    if (method === 'uber' && !address) { showToast('Completá la dirección de entrega'); return; }
    if (method === 'retiro' && PICKUP_POINTS.length > 0) {
      const pickupSel = document.querySelector('input[name=pickupPoint]:checked');
      if (!pickupSel) { showToast('Elegí dónde retirar'); return; }
      const pt = PICKUP_POINTS.find(p => p.id === pickupSel.value);
      address = pt.name + ' — ' + pt.address + (pt.hours ? ' (' + pt.hours + ')' : '');
    }

    const btn = document.getElementById('orderSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Generando link de pago...';
    try {
      const res = await fetch('/.netlify/functions/create-preference', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cart: Object.entries(CART).map(([productId, quantity]) => ({ productId, quantity })),
          buyer: { name, phone, shippingMethod: method, address, postalCode }
        })
      });
      const result = await res.json();
      if (!res.ok || !result.url) throw new Error(result.error || 'No se pudo generar el pago');
      localStorage.removeItem('xiomara_cart');
      window.location.href = result.url;
    } catch (err) {
      showToast(err.message);
      btn.disabled = false;
      btn.textContent = 'Confirmar y pagar';
    }
  };

  function render(){
    document.getElementById('brandName').textContent = SETTINGS.store_name || 'Mi tienda';
    document.getElementById('tagline').textContent = SETTINGS.tagline || '';
    document.getElementById('banner').classList.toggle('show', !SETTINGS.whatsapp);
    document.getElementById('wspFloat').style.display = SETTINGS.whatsapp ? 'flex' : 'none';

    const cats = ['Todos', ...new Set(PRODUCTS.map(p => p.category).filter(Boolean))];
    const chipsEl = document.getElementById('chips');
    chipsEl.innerHTML = cats.map(c =>
      '<button class="chip ' + (c === activeCat ? 'active' : '') + '" data-cat="' + escHtml(c) + '">' + escHtml(c) + '</button>'
    ).join('');
    chipsEl.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => { activeCat = btn.dataset.cat; render(); };
    });

    let list = PRODUCTS.filter(p => {
      const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
      const matchesCat = activeCat === 'Todos' || p.category === activeCat;
      return matchesSearch && matchesCat;
    });

    const available = PRODUCTS.filter(p => p.status === 'disponible').length;
    document.getElementById('countLbl').innerHTML = '<b>' + PRODUCTS.length + '</b> productos · <b>' + available + '</b> disponibles';

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    if (list.length === 0) { grid.style.display = 'none'; empty.style.display = 'block'; return; }
    grid.style.display = 'grid'; empty.style.display = 'none';

    grid.innerHTML = list.map(p => {
      const stock = Number(p.stock) || 0;
      const sold = stock <= 0;
      const inCart = isInCart(p.id);
      const thumb = (p.images && p.images[0]) ? p.images[0] : p.image;
      const imgHtml = thumb
        ? '<img src="' + escHtml(thumb) + '" alt="' + escHtml(p.name) + '" data-cat="' + escHtml(p.category||'') + '" onerror="imgFallback(this)">'
        : iconFor(p.category);

      return '' +
      '<div class="card ' + (sold?'sold':'') + '">' +
        '<div class="tag-hole"><svg viewBox="0 0 24 24" fill="#F0C878"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg></div>' +
        '<div class="card-img" onclick="openDetail(\'' + p.id + '\')" style="cursor:pointer;">' + imgHtml + '<div class="ribbon">Agotado</div></div>' +
        '<div class="card-body">' +
          '<div onclick="openDetail(\'' + p.id + '\')" style="cursor:pointer;">' +
            '<div class="card-cat">' + escHtml(p.category || 'Sin categoría') + '</div>' +
            '<div class="card-name">' + escHtml(p.name) + '</div>' +
            '<div class="card-price">' + money(p.price) + '</div>' +
            '<div class="stock-hint">' + (!sold && stock <= 3 ? 'Quedan ' + stock : '') + '</div>' +
          '</div>' +
          (sold
            ? '<div class="sold-label">Agotado</div>'
            : (inCart
                ? qtyStepperHtml(p.id, false, false)
                : '<button class="cta cta-add" onclick="addToCart(\'' + p.id + '\')">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Agregar al carrito' +
                  '</button>')
          ) +
        '</div>' +
      '</div>';
    }).join('');
  }

  let detailSlides = [];
  let detailSlideIndex = 0;
  let detailSold = false;
  let detailOpenId = null;

  window.openDetail = function(id){
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
    detailOpenId = id;
    const stock = Number(p.stock) || 0;
    detailSold = stock <= 0;
    const inCart = isInCart(p.id);

    detailSlides = [
      ...((p.images && p.images.length) ? p.images : (p.image ? [p.image] : [])).map(url => ({ type: 'image', url })),
      ...(p.video ? [{ type: 'video', url: p.video }] : [])
    ];
    detailSlideIndex = 0;

    document.getElementById('detailContent').innerHTML =
      '<div style="position:relative;">' +
        '<button class="panel-close" style="position:absolute; top:10px; right:10px; background:#fff; border-radius:999px; width:28px; height:28px; z-index:3;" onclick="closeOverlay(\'detailOverlay\')">✕</button>' +
        '<div class="carousel-track" id="carouselTrack"></div>' +
      '</div>' +
      '<div style="padding:18px 20px 20px;">' +
        '<div class="card-cat">' + escHtml(p.category || 'Sin categoría') + '</div>' +
        '<div class="serif" style="font-size:20px; margin:4px 0 8px;">' + escHtml(p.name) + '</div>' +
        '<div class="card-price" style="font-size:19px; margin-bottom:2px;">' + money(p.price) + '</div>' +
        (!detailSold && stock <= 3 ? '<div class="stock-hint" style="margin-bottom:10px;">Quedan ' + stock + '</div>' : '<div style="margin-bottom:12px;"></div>') +
        '<div style="font-size:13.5px; color:#4A3B36; line-height:1.5; white-space:pre-wrap; margin-bottom:16px;">' +
          (p.description ? escHtml(p.description) : '<span style="color:#A9998F; font-style:italic;">Sin descripción todavía.</span>') +
        '</div>' +
        (detailSold
          ? '<div class="sold-label" style="margin-top:0;">Agotado</div>'
          : (inCart
              ? qtyStepperHtml(p.id, false, false)
              : '<button class="cta cta-add" onclick="addToCart(\'' + p.id + '\'); openDetail(\'' + p.id + '\');">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Agregar al carrito' +
                '</button>')
        ) +
      '</div>';

    renderCarouselSlide(p.category);
    document.getElementById('detailOverlay').classList.add('show');
  };

  function renderCarouselSlide(category){
    const track = document.getElementById('carouselTrack');
    if (!track) return;
    if (detailSlides.length === 0) {
      track.innerHTML = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; opacity:0.35;">' + iconFor(category) + '</div>' +
        (detailSold ? '<div class="ribbon">Vendido</div>' : '');
      return;
    }
    const slide = detailSlides[detailSlideIndex];
    const media = slide.type === 'video'
      ? '<video src="' + escHtml(slide.url) + '" controls playsinline></video>'
      : '<img src="' + escHtml(slide.url) + '">';
    const arrows = detailSlides.length > 1
      ? '<button class="carousel-arrow" style="left:10px;" onclick="carouselMove(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<button class="carousel-arrow" style="right:10px;" onclick="carouselMove(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>' +
        '<div class="carousel-dots">' + detailSlides.map((s,i) => '<div class="carousel-dot ' + (i===detailSlideIndex?'active':'') + '"></div>').join('') + '</div>'
      : '';
    track.innerHTML = media + arrows + (detailSold ? '<div class="ribbon">Vendido</div>' : '');
  }

  window.carouselMove = function(dir){
    detailSlideIndex = (detailSlideIndex + dir + detailSlides.length) % detailSlides.length;
    renderCarouselSlide();
  };

  window.closeOverlay = function(id){ document.getElementById(id).classList.remove('show'); };

  document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });

  const params = new URLSearchParams(window.location.search);
  const pago = params.get('pago');
  if (pago === 'exito') setTimeout(() => showToast('✅ ¡Pago aprobado! Gracias por tu compra.'), 500);
  if (pago === 'fallo') setTimeout(() => showToast('❌ El pago no se completó'), 500);
  if (pago === 'pendiente') setTimeout(() => showToast('⏳ Pago pendiente'), 500);

  loadData();
</script>
</body>
</html>
